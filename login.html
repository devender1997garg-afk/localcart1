<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LocalCart - Customer Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e9f9ef,#ffffff);
}

.box{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:30px 25px;
  border-radius:24px;
  box-shadow:0 15px 50px #0002;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  color:#16a05d;
}

.logo span{
  color:#222;
}

.sub{
  text-align:center;
  color:#777;
  margin:8px 0 25px;
}

.badge{
  text-align:center;
  background:#e8f8ee;
  color:#12844c;
  padding:10px;
  border-radius:10px;
  margin-bottom:20px;
  font-size:13px;
  font-weight:bold;
}

.field{
  margin-bottom:14px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:11px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#16a05d;
}

.continue{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#16a05d;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:5px;
}

.msg{
  min-height:20px;
  color:#d33;
  text-align:center;
  font-size:13px;
  margin-top:12px;
}

.note{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:20px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    Local<span>Cart</span>
  </div>

  <div class="sub">
    Your local stores, delivered 🛒
  </div>

  <div class="badge">
    👤 Customer Account
  </div>


  <div class="field">

    <label>Full Name</label>

    <input
      id="customerName"
      type="text"
      placeholder="Enter your full name"
      autocomplete="name"
    >

  </div>


  <div class="field">

    <label>Mobile Number</label>

    <input
      id="customerMobile"
      type="tel"
      maxlength="10"
      inputmode="numeric"
      placeholder="10 digit mobile number"
      autocomplete="tel"
    >

  </div>


  <div class="field">

    <label>Delivery Address</label>

    <input
      id="customerAddress"
      type="text"
      placeholder="House / Street / Area"
      autocomplete="street-address"
    >

  </div>


  <button
    class="continue"
    onclick="customerLogin()"
  >
    Continue
  </button>


  <div
    id="msg"
    class="msg"
  ></div>


  <div class="note">
    Your details are used for your LocalCart orders.
  </div>

</div>


<script>

function customerLogin(){

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

  const mobile =
    document.getElementById(
      "customerMobile"
    ).value.trim();

  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();

  const msg =
    document.getElementById("msg");


  msg.innerText="";


  if(!name){

    msg.innerText=
      "Please enter your name.";

    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    msg.innerText=
      "Please enter a valid 10 digit mobile number.";

    return;
  }


  if(!address){

    msg.innerText=
      "Please enter your delivery address.";

    return;
  }


  /*
    Customer information
  */

  const customer={

    name:name,

    mobile:mobile,

    address:address,

    loggedInAt:
      new Date().toISOString()

  };


  localStorage.setItem(
    "localcartCustomer",
    JSON.stringify(customer)
  );


  /*
    Login history
  */

  let history=
    JSON.parse(
      localStorage.getItem(
        "localcartCustomerHistory"
      )
    ) || [];


  history.unshift({

    action:"Customer Login",

    name:name,

    mobile:mobile,

    time:
      new Date().toLocaleString()

  });


  history=
    history.slice(0,50);


  localStorage.setItem(
    "localcartCustomerHistory",
    JSON.stringify(history)
  );


  /*
    Go to customer home
  */

  window.location.href="index.html";

}

</script>

</body>
</html>
