<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LocalCart — Customer Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#e9f9ef,#ffffff);
  color:#18251d;
}

.box{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px 25px;
  border-radius:24px;
  box-shadow:0 18px 55px #0002;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  color:#16a05d;
}

.logo span{
  color:#222;
}

h1{
  text-align:center;
  font-size:22px;
  margin-top:10px;
}

.sub{
  text-align:center;
  color:#777;
  margin:8px 0 24px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:13px 0 6px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:11px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#16a05d;
}

.loginBtn{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:11px;
  background:#16a05d;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.msg{
  min-height:20px;
  margin-top:12px;
  text-align:center;
  color:#d33;
  font-size:13px;
}

.note{
  margin-top:18px;
  padding:12px;
  background:#f5faf6;
  border-radius:10px;
  text-align:center;
  color:#777;
  font-size:12px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    Local<span>Cart</span>
  </div>

  <h1>👤 Customer Login</h1>

  <p class="sub">
    Login to continue shopping
  </p>

  <label for="name">
    Your Name
  </label>

  <input
    id="name"
    type="text"
    autocomplete="name"
    placeholder="Enter your name"
  >

  <label for="mobile">
    Mobile Number
  </label>

  <input
    id="mobile"
    type="tel"
    maxlength="10"
    inputmode="numeric"
    autocomplete="tel"
    placeholder="10 digit mobile number"
  >

  <button
    class="loginBtn"
    onclick="customerLogin()"
  >
    Continue Shopping
  </button>

  <div id="msg" class="msg"></div>

  <div class="note">
    🛒 Customer access only.<br>
    Store and Website Owner have separate login pages.
  </div>

</div>

<script>

function customerLogin(){

  const name =
    document.getElementById("name")
    .value.trim();

  const mobile =
    document.getElementById("mobile")
    .value.trim();

  const msg =
    document.getElementById("msg");

  msg.innerText="";


  if(name.length < 2){

    msg.innerText =
      "Please enter your name.";

    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    msg.innerText =
      "Please enter a valid 10 digit mobile number.";

    return;
  }


  /*
   * Save customer session
   */

  const customer = {

    name:name,

    mobile:mobile,

    loginTime:
      new Date().toISOString()

  };


  localStorage.setItem(
    "localcartCustomer",
    JSON.stringify(customer)
  );


  /*
   * Save login history
   */

  let history =
    JSON.parse(
      localStorage.getItem(
        "localcartHistory"
      )
    ) || [];


  history.unshift({

    type:"customer_login",

    text:
      "Customer login: " +
      name,

    time:
      new Date().toLocaleString()

  });


  localStorage.setItem(
    "localcartHistory",
    JSON.stringify(
      history.slice(0,100)
    )
  );


  /*
   * Redirect to main store
   */

  window.location.replace(
    "index.html"
  );

}

</script>

</body>
</html>
