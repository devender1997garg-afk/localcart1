<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LocalCart Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f5;
  color:#18251d;
}

header{
  background:#18251d;
  color:white;
  padding:18px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:#5ee49b;
}

.logout{
  border:0;
  background:#fff;
  color:#18251d;
  padding:10px 16px;
  border-radius:9px;
  font-weight:bold;
}

.container{
  width:90%;
  max-width:1100px;
  margin:25px auto;
}

.welcome{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px #0001;
  margin-bottom:20px;
}

.welcome h1{
  font-size:25px;
  margin-bottom:7px;
}

.welcome p{
  color:#777;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 20px #0001;
}

.card h2{
  font-size:19px;
  margin-bottom:17px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:11px 0 6px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}

button{
  cursor:pointer;
}

.primary{
  width:100%;
  border:0;
  background:#16a05d;
  color:white;
  padding:13px;
  border-radius:9px;
  font-weight:bold;
  margin-top:15px;
}

.danger{
  border:0;
  background:#ffe8e8;
  color:#c22;
  padding:8px 11px;
  border-radius:8px;
  font-weight:bold;
}

.store{
  border:1px solid #e5e5e5;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.store strong{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.store small{
  color:#777;
  display:block;
  line-height:1.5;
}

.store button{
  margin-top:10px;
}

.history{
  max-height:300px;
  overflow:auto;
}

.historyItem{
  padding:10px 0;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.historyItem span{
  color:#888;
  display:block;
  margin-top:4px;
}

.empty{
  color:#888;
  font-size:13px;
}

.msg{
  margin-top:10px;
  font-size:13px;
  color:#d33;
}

@media(max-width:600px){

  header{
    padding:15px 5%;
  }

  .container{
    width:92%;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    Local<span>Cart</span>
  </div>

  <button class="logout" onclick="adminLogout()">
    Logout
  </button>

</header>


<div class="container">

  <div class="welcome">

    <h1>👑 Website Owner Dashboard</h1>

    <p>
      Only the LocalCart Website Owner should use this dashboard.
    </p>

  </div>


  <div class="grid">


    <!-- ADD STORE -->

    <div class="card">

      <h2>🏪 Add New Store</h2>

      <label>Store Name</label>

      <input
        id="storeName"
        placeholder="Example: Sharma Grocery"
      >


      <label>Store Owner Name</label>

      <input
        id="ownerName"
        placeholder="Store owner name"
      >


      <label>Mobile Number</label>

      <input
        id="storeMobile"
        type="tel"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 digit mobile"
      >


      <label>Store Password</label>

      <input
        id="storePassword"
        type="password"
        placeholder="Create store password"
      >


      <label>Store Address</label>

      <input
        id="storeAddress"
        placeholder="Store address"
      >


      <button
        class="primary"
        onclick="addStore()"
      >
        + Add Store
      </button>

      <div id="storeMsg" class="msg"></div>

    </div>


    <!-- STORE LIST -->

    <div class="card">

      <h2>🏪 All Stores</h2>

      <div id="storeList"></div>

    </div>


    <!-- HISTORY -->

    <div class="card">

      <h2>📋 Activity History</h2>

      <div id="history" class="history"></div>

    </div>


    <!-- WEBSITE INFO -->

    <div class="card">

      <h2>⚙️ Website Information</h2>

      <p style="color:#777;line-height:1.6;font-size:14px;">
        LocalCart Website Owner has full management
        access from this dashboard.
      </p>

      <button
        class="primary"
        onclick="clearHistory()"
      >
        Clear Activity History
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================
   ADMIN ACCESS
========================================= */

const ADMIN_SESSION_KEY =
  "localcartAdminSession";


/*
   IMPORTANT:
   This is a local/demo owner session.
*/

if(
  localStorage.getItem(
    ADMIN_SESSION_KEY
  ) !== "true"
){

  /*
    For now redirect to login page.
    Change this later to a real backend
    authentication system.
  */

  window.location.href =
    "login.html";

}


/* =========================================
   ADD STORE
========================================= */

function addStore(){

  const name =
    document.getElementById(
      "storeName"
    ).value.trim();

  const owner =
    document.getElementById(
      "ownerName"
    ).value.trim();

  const mobile =
    document.getElementById(
      "storeMobile"
    ).value.trim();

  const password =
    document.getElementById(
      "storePassword"
    ).value;

  const address =
    document.getElementById(
      "storeAddress"
    ).value.trim();

  const msg =
    document.getElementById(
      "storeMsg"
    );


  msg.innerText="";


  if(!name){

    msg.innerText =
      "Store name enter karo.";

    return;
  }


  if(!owner){

    msg.innerText =
      "Store owner name enter karo.";

    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    msg.innerText =
      "Valid 10 digit mobile number enter karo.";

    return;
  }


  if(password.length < 6){

    msg.innerText =
      "Password minimum 6 characters ka hona chahiye.";

    return;
  }


  if(!address){

    msg.innerText =
      "Store address enter karo.";

    return;
  }


  let stores =
    JSON.parse(
      localStorage.getItem(
        "localcartStores"
      )
    ) || [];


  const exists =
    stores.some(function(store){

      return store.mobile === mobile;

    });


  if(exists){

    msg.innerText =
      "Is mobile number ka store already hai.";

    return;
  }


  const store = {

    id:
      "STORE-" +
      Date.now(),

    name:name,

    owner:owner,

    mobile:mobile,

    password:password,

    address:address,

    createdAt:
      new Date().toISOString()

  };


  stores.push(store);


  localStorage.setItem(
    "localcartStores",
    JSON.stringify(stores)
  );


  addHistory(
    "New store added: " +
    name
  );


  document.getElementById(
    "storeName"
  ).value="";

  document.getElementById(
    "ownerName"
  ).value="";

  document.getElementById(
    "storeMobile"
  ).value="";

  document.getElementById(
    "storePassword"
  ).value="";

  document.getElementById(
    "storeAddress"
  ).value="";


  msg.style.color="#12844c";

  msg.innerText =
    "Store successfully created.";


  renderStores();

}


/* =========================================
   SHOW STORES
========================================= */

function renderStores(){

  const list =
    document.getElementById(
      "storeList"
    );


  const stores =
    JSON.parse(
      localStorage.getItem(
        "localcartStores"
      )
    ) || [];


  if(stores.length === 0){

    list.innerHTML =
      '<div class="empty">No stores added yet.</div>';

    return;
  }


  list.innerHTML="";


  stores.forEach(function(store){

    const div =
      document.createElement(
        "div"
      );


    div.className="store";


    div.innerHTML = `

      <strong>
        🏪 ${escapeHTML(store.name)}
      </strong>

      <small>
        Owner: ${escapeHTML(store.owner)}
        <br>
        Mobile: ${escapeHTML(store.mobile)}
        <br>
        Address: ${escapeHTML(store.address)}
        <br>
        Store ID: ${escapeHTML(store.id)}
      </small>

      <button
        class="danger"
        onclick="deleteStore('${store.id}')"
      >
        Delete Store
      </button>

    `;


    list.appendChild(div);

  });

}


/* =========================================
   DELETE STORE
========================================= */

function deleteStore(id){

  const stores =
    JSON.parse(
      localStorage.getItem(
        "localcartStores"
      )
    ) || [];


  const store =
    stores.find(function(item){

      return item.id === id;

    });


  if(!store){

    return;
  }


  const confirmDelete =
    confirm(
      "Delete " +
      store.name +
      "? This cannot be undone."
    );


  if(!confirmDelete){

    return;
  }


  const updated =
    stores.filter(function(item){

      return item.id !== id;

    });


  localStorage.setItem(
    "localcartStores",
    JSON.stringify(updated)
  );


  addHistory(
    "Store deleted: " +
    store.name
  );


  renderStores();

}


/* =========================================
   HISTORY
========================================= */

function addHistory(text){

  let history =
    JSON.parse(
      localStorage.getItem(
        "localcartHistory"
      )
    ) || [];


  history.unshift({

    text:text,

    time:
      new Date().toLocaleString()

  });


  localStorage.setItem(
    "localcartHistory",
    JSON.stringify(
      history.slice(0,100)
    )
  );


  renderHistory();

}


function renderHistory(){

  const box =
    document.getElementById(
      "history"
    );


  const history =
    JSON.parse(
      localStorage.getItem(
        "localcartHistory"
      )
    ) || [];


  if(history.length === 0){

    box.innerHTML =
      '<div class="empty">No activity yet.</div>';

    return;
  }


  box.innerHTML="";


  history.forEach(function(item){

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "historyItem";


    div.innerHTML =
      escapeHTML(item.text) +
      "<span>" +
      escapeHTML(item.time) +
      "</span>";


    box.appendChild(div);

  });

}


/* =========================================
   CLEAR HISTORY
========================================= */

function clearHistory(){

  if(
    !confirm(
      "Clear all activity history?"
    )
  ){

    return;
  }


  localStorage.removeItem(
    "localcartHistory"
  );


  renderHistory();

}


/* =========================================
   LOGOUT
========================================= */

function adminLogout(){

  localStorage.removeItem(
    ADMIN_SESSION_KEY
  );

  window.location.href =
    "login.html";

}


/* =========================================
   SAFE TEXT
========================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================================
   START
========================================= */

renderStores();
renderHistory();

</script>

</body>
</html>
