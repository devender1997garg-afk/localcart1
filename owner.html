<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LocalCart Owner Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7f4;
  color:#18251d;
}

header{
  background:#10251a;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h2{
  font-size:20px;
}

.logout{
  border:0;
  background:white;
  color:#18251d;
  padding:10px 14px;
  border-radius:9px;
  font-weight:bold;
}

main{
  max-width:900px;
  margin:auto;
  padding:25px 15px 60px;
}

.card{
  background:white;
  padding:22px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 5px 25px #0000000d;
}

.card h3{
  margin-bottom:18px;
}

input[type="text"],
input[type="tel"],
input[type="number"]{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
  font-size:15px;
  outline:none;
}

.photoBox{
  border:2px dashed #b9d8c3;
  border-radius:14px;
  padding:20px;
  text-align:center;
  margin-bottom:15px;
  background:#f8fcf9;
}

.photoBox input{
  width:100%;
}

.preview{
  display:none;
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:14px;
  margin:12px auto;
}

.add{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#16a05d;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.product{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.productImg{
  width:75px;
  height:75px;
  border-radius:12px;
  object-fit:cover;
  background:#eef5ef;
  flex-shrink:0;
}

.productInfo{
  flex:1;
}

.productInfo strong{
  display:block;
  margin-bottom:5px;
}

.productInfo small{
  color:#777;
}

.delete{
  border:0;
  background:#ffe7e7;
  color:#c22;
  padding:8px 12px;
  border-radius:8px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.success{
  color:#12844c;
  font-weight:bold;
  margin-top:12px;
}

.orders{
  background:#f8faf8;
  border-radius:12px;
  padding:18px;
  text-align:center;
  color:#777;
}

@media(max-width:600px){

  header{
    padding:15px;
  }

  header h2{
    font-size:17px;
  }

  .product{
    align-items:flex-start;
  }

  .productImg{
    width:65px;
    height:65px;
  }

  .delete{
    font-size:12px;
    padding:7px 9px;
  }

}

</style>

</head>

<body>

<header>

  <h2>👑 LocalCart Owner</h2>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</header>


<main>


<!-- STORE DETAILS -->

<div class="card">

  <h3>🏪 Store Details</h3>

  <input
    type="text"
    id="storeName"
    placeholder="Store name"
  >

  <input
    type="text"
    id="storeAddress"
    placeholder="Store address"
  >

  <input
    type="tel"
    id="storeMobile"
    maxlength="10"
    placeholder="Store mobile number"
  >

  <button
    class="add"
    onclick="saveStore()"
  >
    Save Store
  </button>

  <div
    id="storeMsg"
    class="success"
  ></div>

</div>


<!-- ADD PRODUCT -->

<div class="card">

  <h3>➕ Add Product</h3>


  <div class="photoBox">

    <strong>📸 Product Photo</strong>

    <br><br>

    <input
      type="file"
      id="productPhoto"
      accept="image/*"
    >

    <img
      id="photoPreview"
      class="preview"
      alt="Product preview"
    >

  </div>


  <input
    type="text"
    id="productName"
    placeholder="Product name"
  >


  <input
    type="number"
    id="productPrice"
    placeholder="Price ₹"
    min="0"
  >


  <input
    type="text"
    id="productUnit"
    placeholder="Unit e.g. 1 Kg / 1 Litre / Pack"
  >


  <button
    class="add"
    onclick="addProduct()"
  >
    Add Product
  </button>

</div>


<!-- PRODUCTS -->

<div class="card">

  <h3>📦 My Products</h3>

  <div id="products"></div>

</div>


<!-- ORDERS -->

<div class="card">

  <h3>📋 Orders</h3>

  <div class="orders">

    No orders yet.

    <br><br>

    Customer orders will appear here
    after the database is connected.

  </div>

</div>


</main>


<script>


/* LOAD OWNER DATA */

let data = JSON.parse(
  localStorage.getItem("localcartOwnerData")
) || {

  name:"",
  address:"",
  mobile:"",
  products:[]

};


/* STORE DETAILS */

document.getElementById(
  "storeName"
).value = data.name || "";


document.getElementById(
  "storeAddress"
).value = data.address || "";


document.getElementById(
  "storeMobile"
).value = data.mobile || "";


/* SAVE DATA */

function saveData(){

  localStorage.setItem(
    "localcartOwnerData",
    JSON.stringify(data)
  );

}


/* SAVE STORE */

function saveStore(){

  const name =
    document.getElementById(
      "storeName"
    ).value.trim();


  const address =
    document.getElementById(
      "storeAddress"
    ).value.trim();


  const mobile =
    document.getElementById(
      "storeMobile"
    ).value.trim();


  if(!name){

    alert("Store name enter karo.");

    return;

  }


  if(!address){

    alert("Store address enter karo.");

    return;

  }


  if(
    mobile &&
    !/^[0-9]{10}$/.test(mobile)
  ){

    alert(
      "Valid 10 digit mobile number enter karo."
    );

    return;

  }


  data.name = name;

  data.address = address;

  data.mobile = mobile;


  saveData();


  document.getElementById(
    "storeMsg"
  ).innerText =
    "✓ Store details saved successfully";


}


/* PHOTO PREVIEW */

document.getElementById(
  "productPhoto"
).addEventListener(
  "change",
  function(event){

    const file =
      event.target.files[0];


    if(!file){

      return;

    }


    if(!file.type.startsWith("image/")){

      alert(
        "Sirf image file select karo."
      );

      event.target.value="";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        const preview =
          document.getElementById(
            "photoPreview"
          );


        preview.src = e.target.result;

        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* ADD PRODUCT */

function addProduct(){

  const name =
    document.getElementById(
      "productName"
    ).value.trim();


  const price =
    document.getElementById(
      "productPrice"
    ).value.trim();


  const unit =
    document.getElementById(
      "productUnit"
    ).value.trim();


  const photo =
    document.getElementById(
      "productPhoto"
    ).files[0];


  if(!name){

    alert("Product name enter karo.");

    return;

  }


  if(!price){

    alert("Product price enter karo.");

    return;

  }


  if(!unit){

    alert("Product unit enter karo.");

    return;

  }


  /*
    Photo ko browser ke local storage
    me Base64 ke roop me save kar rahe hain.
  */

  if(photo){

    const reader =
      new FileReader();


    reader.onload =
      function(e){

        saveProduct(
          name,
          price,
          unit,
          e.target.result
        );

      };


    reader.readAsDataURL(photo);

  }

  else{

    saveProduct(
      name,
      price,
      unit,
      ""
    );

  }

}


/* SAVE PRODUCT */

function saveProduct(
  name,
  price,
  unit,
  photo
){

  data.products.push({

    id:Date.now(),

    name:name,

    price:"₹" + price,

    unit:unit,

    photo:photo

  });


  saveData();


  document.getElementById(
    "productName"
  ).value="";


  document.getElementById(
    "productPrice"
  ).value="";


  document.getElementById(
    "productUnit"
  ).value="";


  document.getElementById(
    "productPhoto"
  ).value="";


  const preview =
    document.getElementById(
      "photoPreview"
    );


  preview.src="";

  preview.style.display="none";


  renderProducts();


  alert(
    "Product successfully added! ✅"
  );

}


/* DELETE PRODUCT */

function deleteProduct(index){

  if(
    !confirm(
      "Is product ko delete karna hai?"
    )
  ){

    return;

  }


  data.products.splice(
    index,
    1
  );


  saveData();

  renderProducts();

}


/* SHOW PRODUCTS */

function renderProducts(){

  const box =
    document.getElementById(
      "products"
    );


  if(data.products.length === 0){

    box.innerHTML =
      '<div class="empty">No products added yet.</div>';

    return;

  }


  box.innerHTML="";


  data.products.forEach(
    function(product,index){

      const image =
        product.photo
        ? `<img
             class="productImg"
             src="${product.photo}"
             alt="${product.name}"
           >`
        : `<div
             class="productImg"
             style="
               display:flex;
               align-items:center;
               justify-content:center;
               font-size:30px;
             "
           >
             🛒
           </div>`;


      box.innerHTML += `

        <div class="product">

          ${image}

          <div class="productInfo">

            <strong>
              ${escapeHTML(product.name)}
            </strong>

            <small>
              ${escapeHTML(product.unit)}
              •
              ${escapeHTML(product.price)}
            </small>

          </div>

          <button
            class="delete"
            onclick="deleteProduct(${index})"
          >
            Delete
          </button>

        </div>

      `;

    }
  );

}


/* BASIC HTML ESCAPE */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* LOGOUT */

function logout(){

  window.location.href =
    "login.html";

}


/* INITIAL LOAD */

renderProducts();

</script>

</body>
</html>
