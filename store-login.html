<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LocalCart Store Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(135deg,#e9f9ef,#ffffff);
}

.box{
  width:100%;
  max-width:430px;
  background:#ffffff;
  padding:30px 25px;
  border-radius:25px;
  box-shadow:0 18px 55px #0002;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  color:#16a05d;
}

.logo span{
  color:#222;
}

.title{
  text-align:center;
  font-size:21px;
  font-weight:bold;
  margin-top:8px;
}

.sub{
  text-align:center;
  color:#777;
  margin:8px 0 24px;
}

.storeBadge{
  text-align:center;
  background:#18251d;
  color:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:20px;
  font-size:13px;
  font-weight:bold;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:13px 0 6px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:11px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#16a05d;
}

.loginBtn{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:11px;
  background:#16a05d;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.msg{
  min-height:20px;
  text-align:center;
  color:#d33;
  font-size:13px;
  margin-top:13px;
}

.links{
  margin-top:22px;
  text-align:center;
}

.links a{
  color:#12844c;
  text-decoration:none;
  font-size:13px;
}

.info{
  margin-top:18px;
  padding:12px;
  background:#f5faf6;
  border-radius:10px;
  color:#777;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

</style>
</head>


<body>

<div class="box">

  <div class="logo">
    Local<span>Cart</span>
  </div>

  <div class="title">
    Store Login
  </div>

  <div class="sub">
    Manage your shop on LocalCart
  </div>

  <div class="storeBadge">
    🏪 STORE ACCESS
  </div>


  <label for="mobile">
    Store Mobile Number
  </label>

  <input
    id="mobile"
    type="tel"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter 10 digit mobile number"
  >


  <label for="password">
    Store Password
  </label>

  <input
    id="password"
    type="password"
    placeholder="Enter your store password"
  >


  <button
    class="loginBtn"
    onclick="storeLogin()"
  >
    Login to Store
  </button>


  <div
    id="msg"
    class="msg"
  ></div>


  <div class="links">

    <a href="login.html">
      ← Customer Login
    </a>

  </div>


  <div class="info">

    Store account is created and managed
    by the LocalCart Website Owner.

  </div>

</div>


<script>

function storeLogin(){

  const mobile =
    document.getElementById("mobile")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const msg =
    document.getElementById("msg");


  msg.innerText="";


  if(!/^[0-9]{10}$/.test(mobile)){

    msg.innerText =
      "Valid 10 digit mobile number enter karo.";

    return;

  }


  if(!password){

    msg.innerText =
      "Store password enter karo.";

    return;

  }


  /*
   * Stores created by Website Owner
   */

  const stores =
    JSON.parse(
      localStorage.getItem(
        "localcartStores"
      )
    ) || [];


  /*
   * Find matching store
   */

  const store =
    stores.find(function(item){

      return (
        item.mobile === mobile &&
        item.password === password
      );

    });


  if(!store){

    msg.innerText =
      "Mobile number ya password incorrect.";

    return;

  }


  /*
   * Store session
   */

  localStorage.setItem(
    "localcartStoreSession",
    JSON.stringify({

      storeId:store.id,

      name:store.name,

      owner:store.owner,

      mobile:store.mobile,

      address:store.address,

      loginTime:
        new Date().toISOString()

    })
  );


  /*
   * Activity history
   */

  let history =
    JSON.parse(
      localStorage.getItem(
        "localcartHistory"
      )
    ) || [];


  history.unshift({

    type:"store_login",

    text:
      "Store login: " +
      store.name,

    storeId:store.id,

    time:
      new Date().toLocaleString()

  });


  localStorage.setItem(
    "localcartHistory",
    JSON.stringify(
      history.slice(0,100)
    )
  );


  /*
   * Open Store Dashboard
   */

  window.location.href =
    "owner.html";

}

</script>

</body>
</html>
